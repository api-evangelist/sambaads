description: >-
  SambaAds is a company surfaced as a portfolio company of 500 Global and added
  to the API Evangelist network as a lead for enrichment. As of this pass the
  registered website (ycontent.com.br) serves yContent, a Brazilian coupon and
  discount aggregation platform (part of Rede de Cupons / Ganhe de Volta) that
  verifies and publishes working promotional codes for major Brazilian
  e-commerce retailers such as Amazon, Americanas, Kabum and Sephora. The site
  is a consumer-facing web property; it publishes no developer portal, API
  documentation, OpenAPI/AsyncAPI specification, SDKs, or /.well-known discovery
  surface, so there is no public API surface to catalog at this time. This
  profile records the honest result of an enrichment pass (domain-security
  probe plus well-known and security.txt probes) and remains a lead awaiting any
  future developer program.
